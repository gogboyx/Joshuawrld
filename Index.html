<style>
/* Layout: full-bleed 3D city. HUD is light paper pills along the edges; thumb zones are joystick (bottom-left) and actions (bottom-right). One committed look, so single theme. */
:root{
  --paper:#fbfaf5; --paper-2:#eef0e8; --ink:#13211a; --muted:#66756c;
  --green:#1c9a5e; --green-d:#0f6b3f; --gold:#f2b01e; --danger:#d6452f; --night:#0b1128;

  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--night)}
#hud{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}

svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill{display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border-radius:999px;padding:0 14px;height:44px;box-shadow:0 2px 0 rgba(0,0,0,.12),0 8px 20px rgba(5,10,30,.28);font-weight:700;font-size:15px;white-space:nowrap}
.pill b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top .mini{width:76px;justify-content:center;padding:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(28,154,94,.22);flex:none}
.money{padding-right:5px}
.money button{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;padding:0}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;align-items:stretch;padding-top:10px}
.card{display:flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border-radius:20px;padding:10px 14px;box-shadow:0 2px 0 rgba(0,0,0,.12),0 8px 20px rgba(5,10,30,.28);position:relative;max-width:480px}

.card .t small{font-size:13px;color:var(--muted)}
.card .when{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink)}
.card .x{position:absolute;right:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 10px rgba(5,10,30,.3);padding:0}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),#dfe5dc 0);display:grid;place-items:center;flex:none}
.ring b{width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:17px}
#toast{align-self:center;background:rgba(19,33,26,.92);color:var(--paper);padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;pointer-events:none;text-align:center}

.bottom{position:relative;height:324px;flex:none;pointer-events:none}
#joy{position:absolute;left:4px;bottom:132px;width:136px;height:136px;border-radius:50%;background:rgba(251,250,245,.18);border:2px solid rgba(251,250,245,.55);backdrop-filter:blur(3px);touch-action:none}

.rail{position:absolute;right:0;bottom:132px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.rb{width:56px;height:56px;border-radius:50%;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.12),0 8px 18px rgba(5,10,30,.3);padding:0}
.rb svg.i{width:20px;height:20px}
.rb.on{background:var(--gold)}
#hud.drive-mode #runBtn{background:#d6452f;color:#fff}
#hud.drive-mode #jumpBtn{background:#1c9a5e;color:#fff}

.rb:active{transform:translateY(1px)}
#action{height:56px;border-radius:999px;background:var(--green);color:#fff;padding:0 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:112px;box-shadow:0 3px 0 var(--green-d),0 10px 22px rgba(5,10,30,.35);font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15}
#action[hidden]{display:none}
#action small{font-family:var(--body);font-size:11px;font-weight:500;opacity:.85}
.status{position:absolute;left:0;bottom:64px;display:flex;align-items:center;gap:8px}
.avatar{width:52px;height:52px;border-radius:50%;background:#d6ecd9;border:3px solid var(--green);display:grid;place-items:center;overflow:hidden}
.status .pill{height:40px;padding:0 12px;font-size:14px}
.meter{--p:50;width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),#e8dfc4 0)}
nav{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;max-width:420px}
nav .tabs{flex:1;display:flex;background:rgba(251,250,245,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:4px;box-shadow:0 6px 22px rgba(5,10,30,.22)}
nav .tabs button{flex:1;min-width:0;height:44px;border-radius:999px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
nav .tabs button.on{flex:2.1;background:#dff1e5;color:var(--green-d)}
nav .tabs button span{display:none}
nav .tabs button.on span{display:inline}
#phone{position:relative;width:52px;height:52px;border-radius:50%;background:rgba(251,250,245,.92);backdrop-filter:blur(10px);display:grid;place-items:center;padding:0;box-shadow:0 6px 22px rgba(5,10,30,.22);flex:none;pointer-events:auto}
#phone.live::after{content:"";position:absolute;top:7px;right:7px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;margin-top:14px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;color:var(--ink);font-weight:700;font-size:12px;padding:0}
.app i{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;color:#fff}
.app.on i{box-shadow:0 0 0 3px var(--gold)}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,20,.5)}
#sheet[hidden]{display:none}
#sheet .panel{width:100%;max-width:520px;box-sizing:border-box;background:var(--paper);color:var(--ink);border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 22px);max-height:86%;overflow:auto;animation:rise .25s ease-out;touch-action:pan-y}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel h2{margin:0;font-family:var(--display);font-size:22px}

.panel canvas{display:block;width:100%;max-width:380px;aspect-ratio:1;margin:0 auto;border-radius:16px;background:#cfe3ee}
.panel p{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.45;max-width:60ch}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #e1e5dc}
.row:first-of-type{border-top:0}
.row strong{font-size:15px}
.row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.sw button{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #cfd6cb;padding:0}
.sw button.on{box-shadow:0 0 0 3px var(--green)}
.btn{background:var(--green);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;font-size:15px}
.btn.alt{background:var(--paper-2);color:var(--ink)}
.tg{width:52px;height:30px;border-radius:999px;background:#cfd6cb;position:relative;flex:none;padding:0}

    try{
      let nv=0,ni=0;geos.forEach(g=>{nv+=g.attributes.position.count;ni+=g.index.count;});
      const pos=new Float32Array(nv*3),nor=new Float32Array(nv*3),uv=new Float32Array(nv*2),idx=new Uint32Array(ni);

        const ia=g.index.array;for(let i=0;i<ia.length;i++)idx[io+i]=ia[i]+vo;
        vo+=g.attributes.position.count;io+=ia.length;g.dispose();
      });

      bg.setAttribute('position',new THREE.BufferAttribute(pos,3));bg.setAttribute('normal',new THREE.BufferAttribute(nor,3));bg.setAttribute('uv',new THREE.BufferAttribute(uv,2));

    }

}

/* =====================================================================
   NIGHT LIGHTING: one small module drives every venue (hospital, J F, boutique)
   - fxLamp   : emissive fixture material that switches from "day" to "night" colour
   - fxPool   : additive light pool on the ground (forecourts, drive-thru lane)
   - fxGlow   : additive halo sprite (signs, domes, lamp posts)
   - venueLights : ceiling light-panel grid, one draw call per venue
   updFX() runs once per frame from the main loop.
   ===================================================================== */
const FX={lamps:[],glows:[]};
function fxLamp(dayHex,nightHex){
  const m=new THREE.MeshBasicMaterial({color:dayHex});
  FX.lamps.push({m:m,d:new THREE.Color(dayHex),n:new THREE.Color(nightHex)});return m;
}
const FXM={warm:fxLamp(0xe6dcc2,0xfff1c8),cool:fxLamp(0xdde6ea,0xeaf7ff),gold:fxLamp(0xcdbb8a,0xffd978),glass:fxLamp(0x9fd4f0,0xffe9a8)};
const glowTex=canvasTex(128,128,(g,w,h)=>{
  const r=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(0.4,'rgba(255,255,255,0.45)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,w,h);
});
function fxMat(color){return new THREE.MeshBasicMaterial({map:glowTex,color:color,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});}
function fxPool(x,z,w,d,color,peak){
  const g=new THREE.PlaneGeometry(w,d);g.rotateX(-Math.PI/2);
  const m=fxMat(color),me=new THREE.Mesh(g,m);me.position.set(x,0.37,z);me.visible=false;scene.add(me);
  FX.glows.push({m:m,me:me,peak:peak});
}
function fxGlow(x,y,z,size,color,peak){
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:color,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.position.set(x,y,z);sp.scale.set(size,size,1);sp.visible=false;scene.add(sp);
  FX.glows.push({m:sp.material,me:sp,peak:peak});
}
function updFX(){
  const n=night;
  for(const l of FX.lamps)l.m.color.copy(l.d).lerp(l.n,n);
  const on=n>0.02;
  for(const g of FX.glows){g.me.visible=on;if(on)g.m.opacity=n*g.peak;}
}

    let gap=999;

    let target=v.max;if(gap<14)target=Math.min(v.max,Math.max(0,(gap-7)*1.6));
    v.speed+=clamp(target-v.speed,-18*dt,6*dt);
    v.pos+=v.dir*v.speed*dt;if(v.pos>184)v.pos=-184;if(v.pos<-184)v.pos=184;

    if(v.axis==='z'){x=v.line+v.off;z=v.pos;yaw=v.dir>0?0:Math.PI;hx=v.hw;hz=v.hl;}
    else{x=v.pos;z=v.line+v.off;yaw=v.dir>0?Math.PI/2:-Math.PI/2;hx=v.hl;hz=v.hw;}
    v.g.position.set(x,0.02,z);v.g.rotation.y=yaw;
    v.spin=(v.spin||0)+v.speed*dt*(v.dir||1);

    vboxes.push({x0:x-hx,x1:x+hx,z0:z-hz,z1:z+hz});
  }
}

function shp(cmds){
  const s=new THREE.Shape();
  cmds.forEach(p=>{const k=p[0];
    if(k==='m')s.moveTo(p[1],p[2]);else if(k==='l')s.lineTo(p[1],p[2]);
    else if(k==='q')s.quadraticCurveTo(p[1],p[2],p[3],p[4]);
    else if(k==='b')s.bezierCurveTo(p[1],p[2],p[3],p[4],p[5],p[6]);
    else if(k==='a')s.absarc(p[1],p[2],p[3],p[4],p[5],p[6]);});
  return s;
}

}

function installRealSedan(target,source){
  if(!target||!source)return;

  let bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3());
  if(size.x>size.z){model.rotation.y=Math.PI/2;bounds=new THREE.Box3().setFromObject(model);size=bounds.getSize(new THREE.Vector3());}
  const longest=Math.max(size.x,size.z),shortest=Math.min(size.x,size.z);
  const scale=Math.min(4.6/Math.max(longest,0.01),2.2/Math.max(shortest,0.01),1.8/Math.max(size.y,0.01));
  model.scale.setScalar(scale);
  bounds=new THREE.Box3().setFromObject(model);
  const center=bounds.getCenter(new THREE.Vector3());
  model.position.x-=center.x;model.position.y-=bounds.min.y;model.position.z-=center.z;
  // The source GLB faces backwards relative to Joshua Streets' +Z-forward vehicle controller.
  // Rotate the imported model locally so Gas, Reverse, steering and the camera agree.
  model.rotation.y+=Math.PI;
  model.traverse(o=>{
    if(!o.isMesh)return;
    o.castShadow=true;o.receiveShadow=true;
    if(o.material){
      const mats=Array.isArray(o.material)?o.material:[o.material];
      mats.forEach(m=>{m=m; if(/body|paint|carpaint/i.test(o.name)&&m.color){m.color.set(0xf4f4f1);if('metalness' in m)m.metalness=0.48;if('roughness' in m)m.roughness=0.28;}});

  target.g.add(model);

  target.modelLoaded=true;
}

const wardrobe={on:false,tab:'outfits'};
const jv={x:0,y:0},keys={},joy=$('joy'),knob=$('knob');let jid=null;const JR=48;
function joyUpdate(e){
  const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const l=Math.hypot(dx,dy);
  if(l>JR){dx=dx/l*JR;dy=dy/l*JR;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)';
  const x=dx/JR,y=dy/JR;jv.x=Math.abs(x)<0.1?0:x;jv.y=Math.abs(y)<0.1?0:y;
}
function joyEnd(e){if(e.pointerId!==jid)return;jid=null;jv.x=0;jv.y=0;knob.style.transform='';}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;try{joy.setPointerCapture(e.pointerId);}catch(x){}joyUpdate(e);e.preventDefault();});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyUpdate(e);});
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(k==='shift')keys.shift=true;
  if(k===' '){jump();e.preventDefault();}
  if(k==='f'||k==='enter')doAction();
  if(k==='t'){whistleSound();callCab();}
  if(k==='p'){if(PH.open)closePhone();else openPhone();}
  if(k==='q')cam.yaw+=0.25;
  if(k==='e')cam.yaw-=0.25;
  if(k==='arrowup'||k==='arrowdown'||k==='arrowleft'||k==='arrowright')e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='Shift')keys.shift=false;});
function inputVec(){
  if(busy||wardrobe.on||PH.open||HD.on)return{x:0,f:0};
  if(S.driving){
    const x=jv.x||((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0));
    const gas=gasHeld||keys.w||keys.arrowup,brake=brakeHeld||keys.s||keys.arrowdown;
    return{x:clamp(x,-1,1),f:gas&&brake?0:(gas?1:(brake?-1:0))};
  }
  let x=jv.x,f=-jv.y;
  if(!x&&!f){
    x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
    f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
    const l=Math.hypot(x,f);if(l>1){x/=l;f/=l;}

}

const ptrs=new Map();let lastPinch=1;

function updPlayer(dt){
  const inp=inputVec(),mag=Math.min(1,Math.hypot(inp.x,inp.f));
  const sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);
  const dx=-sy*inp.f+cy*inp.x,dz=-cy*inp.f-sy*inp.x,dl=Math.hypot(dx,dz)||1;
  const running=(S.run||keys.shift)&&S.energy>3&&mag>0.1;
  const target=(running?CFG.run:CFG.walk)*clamp(mag*1.15,0,1);
  const tvx=mag>0.05?dx/dl*target:0,tvz=mag>0.05?dz/dl*target:0;
  const k=damp(mag>0.05?CFG.accel:CFG.accel*1.4,dt);
  P.vx+=(tvx-P.vx)*k;P.vz+=(tvz-P.vz)*k;
  const px=P.x,pz=P.z;
  P.x+=P.vx*dt;P.z+=P.vz*dt;
  if(collide(P,CFG.radius)){P.vx=(P.x-px)/dt;P.vz=(P.z-pz)/dt;}
  const moved=Math.hypot(P.x-px,P.z-pz)/dt;
  P.speed+=(moved-P.speed)*damp(18,dt);
  P.inF=inp.f;
  const gh=groundH(P.x,P.z);
  P.vy-=CFG.gravity*dt;P.y+=P.vy*dt;
  if(P.y<=gh+0.02||(P.on&&P.vy<=0&&P.y-gh<0.5)){P.y=gh;P.vy=0;P.on=true;}else P.on=false;
  if(P.speed>0.7){P.yaw=angLerp(P.yaw,Math.atan2(P.vx,P.vz),damp(CFG.turn,dt));}
  if(P.speed>0.5)S.energy-=dt*(running?0.5:0.1);else S.energy-=dt*0.015;
  P.visY+=(P.y-P.visY)*(P.on?damp(20,dt):1);
  player.root.position.set(P.x,P.visY,P.z);player.root.rotation.y=P.yaw;
  player.update(dt,P.speed,P.on,P.vy);
}
let driveAcc=0;
function updCar(dt){
  const inp=inputVec(),thr=inp.f,st=clamp(inp.x,-1,1);
  if(thr>0.1)CAR.speed+=thr*VC.acc*dt;else if(thr<-0.1)CAR.speed+=thr*(VC.acc+3)*dt;
  else CAR.speed-=Math.sign(CAR.speed)*Math.min(Math.abs(CAR.speed),9*dt);
  CAR.speed=clamp(CAR.speed,-VC.max*0.32,VC.max);
  CAR.yaw-=st*dt*VC.turn*clamp(CAR.speed/7,-1,1);CAR.steerT=-st*0.5;
  CAR.x+=Math.sin(CAR.yaw)*CAR.speed*dt;CAR.z+=Math.cos(CAR.yaw)*CAR.speed*dt;
  let hit=false;const off=Math.max(VC.hl-1.0,0.3);
  for(let s=-1;s<=1;s+=2){
    const pt={x:CAR.x+Math.sin(CAR.yaw)*off*s,z:CAR.z+Math.cos(CAR.yaw)*off*s},ox=pt.x,oz=pt.z;
    if(collide(pt,VC.hw+0.4)){CAR.x+=pt.x-ox;CAR.z+=pt.z-oz;hit=true;}
  }
  if(hit)CAR.speed*=Math.pow(0.05,dt);
  CAR.y=lerp(CAR.y,groundH(CAR.x,CAR.z),Math.min(1,dt*12));
  carObj.g.position.set(CAR.x,CAR.y,CAR.z);carObj.g.rotation.y=CAR.yaw;
  P.x=CAR.x;P.z=CAR.z;P.y=CAR.y;P.visY=CAR.y;P.speed=0;
  if(VC.rider){player.pose='sit';player.root.visible=true;player.root.position.set(CAR.x-Math.sin(CAR.yaw)*0.45,CAR.y+0.72,CAR.z-Math.cos(CAR.yaw)*0.45);player.root.rotation.y=CAR.yaw;player.update(dt,0,true,0);}
  driveAcc+=Math.abs(CAR.speed)*dt;if(driveAcc>120){driveAcc-=120;addXP(2);}
}
function updCamera(dt){
  if(HD.on){hdCamera(dt);return;}
  const drv=S.driving,tgt=drv?CAR:P;
  cam.tx+=(tgt.x-cam.tx)*damp(16,dt);cam.tz+=(tgt.z-cam.tz)*damp(16,dt);
  cam.ty+=((drv?CAR.y+1.5:P.y+1.5)-cam.ty)*damp(9,dt);
  cam.idle+=dt;
  if(wardrobe.on){cam.yaw+=dt*0.35;}
  else if(drv){if(Math.abs(CAR.speed)>3&&cam.idle>1.2)cam.yaw=angLerp(cam.yaw,CAR.yaw+(CAR.speed>0?Math.PI:0),damp(2,dt));}
  else if(CAMV!=='inside'&&P.speed>1.5&&cam.idle>1.2&&P.inF>0.25)cam.yaw=angLerp(cam.yaw,P.yaw+Math.PI,damp(1.7,dt));
  const vw=(!wardrobe.on&&!drv)?CAMV:'chase';const dist=wardrobe.on?4.3:(drv?cam.dist*1.55:(vw==='above'?15:cam.dist)),pitch=wardrobe.on?0.1:(vw==='above'?1.15:(vw==='inside'?cam.pitch-0.3:cam.pitch));
  if(vw==='inside'){CAMHID=true;if(player.root.visible)player.root.visible=false;}else if(CAMHID){CAMHID=false;if(!drv)player.root.visible=true;}
  const cp=Math.cos(pitch),ox=Math.sin(cam.yaw)*cp,oy=Math.sin(pitch),oz=Math.cos(cam.yaw)*cp;
  let free=dist;
  for(let d=1.2;d<=dist&&vw==='chase';d+=0.5){if(camBlocked(cam.tx+ox*d,cam.ty+oy*d,cam.tz+oz*d)){free=Math.max(1.4,d-0.7);break;}}
  cam.boom=free<cam.boom?free:cam.boom+(free-cam.boom)*damp(2.5,dt);
  const cx=cam.tx+ox*cam.boom,cz=cam.tz+oz*cam.boom;let cyy=cam.ty+oy*cam.boom;
  const gmin=groundH(cx,cz)+0.7;if(cyy<gmin)cyy=gmin;
  if(vw==='inside'){const ex=P.x,ey=P.y+1.6,ez=P.z;camera.position.set(ex,ey,ez);camera.lookAt(ex-ox*6,ey-oy*6,ez-oz*6);}else{
  camera.position.set(cx,cyy,cz);
  camera.lookAt(cam.tx,wardrobe.on?cam.ty-1.0:cam.ty+0.1,cam.tz);}
  const tf=58+(!drv?7*smooth(6.5,CFG.run,P.speed):Math.min(10,Math.abs(CAR.speed)*0.35));

  if(Math.abs(camera.fov-cam.fov)>0.05){camera.fov=cam.fov;camera.updateProjectionMatrix();}
}

/* radio */
let ac=null,rtimer=null,step=0,nextT=0,master=null,noiseBuf=null;
const STATIONS=[{n:'Afrobeat',bpm:102,roots:[110,87.31,130.81,98]},{n:'Highlife',bpm:118,roots:[98,130.81,110,146.83]},{n:'Chill',bpm:80,roots:[87.31,110,98,73.42]}];
let roots=STATIONS[0].roots,bpm=102;const pent=[0,3,5,7,10,12,15];
function ensureAudio(){
  if(ac)return true;const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
  ac=new C();master=ac.createGain();master.gain.value=0.22;master.connect(ac.destination);
  const len=Math.floor(ac.sampleRate*0.5);noiseBuf=ac.createBuffer(1,len,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  return true;
}
function tone(f,t,dur,type,vol,slide){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noise(t,dur,vol,hp){
  const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);
}
function playStep(st,t){
  const bar=Math.floor(st/16)%4,s=st%16,root=roots[bar];
  if(s===0||s===10)tone(120,t,0.18,'sine',0.9,40);
  if(s===4||s===12)noise(t,0.12,0.5,1800);
  if(s%2===0)noise(t,0.04,0.25,7000);else if(s%4===3)noise(t,0.03,0.12,9000);
  if(s===0||s===3||s===6||s===10||s===14)tone(root,t,0.28,'triangle',0.55);
  if((s===2||s===7||s===11||s===15)&&Math.random()<0.8)tone(root*2*Math.pow(2,pent[Math.floor(Math.random()*pent.length)]/12),t,0.2,'square',0.07);
}
function sched(){while(nextT<ac.currentTime+0.3){playStep(step,nextT);nextT+=60/bpm/4;step++;}}
function setRadio(on,idx){
  if(idx!==undefined){S.station=idx;roots=STATIONS[idx].roots;bpm=STATIONS[idx].bpm;}
  if(on){if(!ensureAudio()){toast('Audio is not supported here.');return;}ac.resume();nextT=ac.currentTime+0.08;step=0;clearInterval(rtimer);rtimer=setInterval(sched,70);}
  else{clearInterval(rtimer);rtimer=null;}
  S.radio=on;$('phone').classList.toggle('live',on);toast(on?'Joshua FM · '+STATIONS[S.station].n:'Radio off');
}

/* --- Calculator --- */
function appCalc(b){
  let disp='0',acc=null,op=null,fresh=true;
  b.innerHTML='<div class="cdisp" id="cd">0</div><div class="ckeys"></div>';
  const cd=b.querySelector('.cdisp'),keys=b.querySelector('.ckeys');
  const show=()=>{cd.textContent=disp.length>12?Number(disp).toExponential(4):disp;};
  const calc=(a,o,v)=>o==='+'?a+v:o==='−'?a-v:o==='×'?a*v:o==='÷'?(v===0?NaN:a/v):v;
  const press=k=>{
    if(k>='0'&&k<='9'){disp=(fresh||disp==='0')?k:disp+k;fresh=false;}
    else if(k==='.'){if(fresh){disp='0.';fresh=false;}else if(disp.indexOf('.')<0)disp+='.';}
    else if(k==='C'){disp='0';acc=null;op=null;fresh=true;}
    else if(k==='±'){disp=String(-Number(disp));}
    else if(k==='%'){disp=String(Number(disp)/100);}
    else{
      const v=Number(disp);
      if(op&&!fresh){acc=calc(acc,op,v);disp=isNaN(acc)?'Error':String(parseFloat(acc.toPrecision(12)));}else acc=v;
      op=k==='='?null:k;fresh=true;
    }
    show();
  };
  ['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','='].forEach(k=>{
    const bt=el('button','ck'+('÷×−+='.indexOf(k)>=0?' op':(k==='C'||k==='±'||k==='%'?' fn':'')),k);if(k==='0')bt.classList.add('wide');
    bt.addEventListener('click',()=>press(k));keys.appendChild(bt);
  });
}

function updHospital(dt,inside){
  const near=inHosp(P.x,P.z,5)&&!S.driving;
  for(const b of HB){
    if(b.top.visible!==near)b.top.visible=near;
    if(!near)continue;
    if(b.route){
      const t=b.route[b.i],dx=t.x-b.x,dz=t.z-b.z,d=Math.hypot(dx,dz);
      if(d<0.25){b.v+=(0-b.v)*damp(8,dt);b.wait-=dt;if(b.wait<=0){b.i=(b.i+1)%b.route.length;b.wait=b.route[b.i].w;}}
      else{
        b.v+=(b.speed-b.v)*damp(5,dt);const st=Math.min(d,b.v*dt);b.x+=dx/d*st;b.z+=dz/d*st;b.yaw=angLerp(b.yaw,Math.atan2(dx,dz),damp(8,dt));
      }
      b.ch.root.position.set(b.x,HY,b.z);b.ch.root.rotation.y=b.yaw;
    }
    b.ch.update(dt,b.v,true,0);
  }
  if(inside&&!busy&&!PH.open&&sheet.hidden){paT-=dt;if(paT<=0){paT=rr(30,48);toast('Hospital announcement: '+pickOne(PA));}}
  if(S.driving||!inside)paT=Math.max(paT,10);
}

const CAB={state:'none',v:null,x:0,z:0,stop:0,wait:0,label:'Cab'};

const vehXZ=v=>v.axis==='z'?{x:v.line+v.off,z:v.pos}:{x:v.pos,z:v.line+v.off};
const bookable=v=>v.taxi||!!(VEH[v.kind]&&VEH[v.kind].pub);
function nearestRoad(x,z){
  if(z>215||(z>190&&Math.abs(x)<10))return{axis:'z',line:0,pos:clamp(z,BR0-6,ISL_Z1-8),side:x>=0?1:-1,bridge:true};
  let best=null,bd=1e9;
  for(const L of lines){
    const dz=Math.abs(z-L);if(dz<bd){bd=dz;best={axis:'x',line:L,pos:clamp(x,-176,176),side:z>=L?1:-1};}
    const dx=Math.abs(x-L);if(dx<bd){bd=dx;best={axis:'z',line:L,pos:clamp(z,-176,176),side:x>=L?1:-1};}
  }
  return best;
}
function cabsNearby(){let n=0;for(const v of traffic){if(!bookable(v))continue;const p=vehXZ(v);if(Math.hypot(p.x-P.x,p.z-P.z)<260)n++;}return n;}
function whistleSound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    window.__wc=window.__wc||new AC();const c=window.__wc;if(c.state==='suspended')c.resume();
    const o=c.createOscillator(),lf=c.createOscillator(),lg=c.createGain(),g=c.createGain(),t=c.currentTime;
    o.type='sine';o.frequency.setValueAtTime(1500,t);o.frequency.linearRampToValueAtTime(2500,t+0.18);o.frequency.linearRampToValueAtTime(2100,t+0.5);
    lf.frequency.value=28;lg.gain.value=90;lf.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.22,t+0.04);g.gain.linearRampToValueAtTime(0.0,t+0.55);
    o.connect(g);g.connect(c.destination);o.start(t);lf.start(t);o.stop(t+0.6);lf.stop(t+0.6);
  }catch(e){}
}
function callCab(){
  if(S.driving){toast('You are driving your own car.');return false;}
  if(CAB.state==='coming'){toast('Your '+CAB.label+' is on the way. Meet it at the road.');return true;}
  if(CAB.state==='waiting'||CAB.state==='riding'){toast('Your '+CAB.label+' is waiting. Walk up to it.');return true;}
  let best=null,bd=1e9;
  for(const v of traffic){if(!bookable(v))continue;const p=vehXZ(v);let d=Math.hypot(p.x-P.x,p.z-P.z);if(v.taxi)d-=60;if(d<bd){bd=d;best=v;}}
  if(!best){toast('No cabs around right now. Try again in a moment.');return false;}
  const rd=nearestRoad(P.x,P.z),dir=rd.axis==='x'?(rd.side>0?1:-1):(rd.side>0?-1:1),off=rd.axis==='x'?3*dir:-3*dir;
  const hi=rd.bridge?ISL_Z1-6:184,lo=rd.bridge?-184:-184;
  best.axis=rd.axis;best.line=rd.line;best.dir=dir;best.off=off;best.pos=clamp(rd.pos-dir*100,lo,hi);best.speed=8;
  traffic.splice(traffic.indexOf(best),1);
  Object.assign(CAB,{state:'coming',v:best,stop:rd.pos,wait:0,label:best.taxi?'cab':(VEH[best.kind]&&VEH[best.kind].pub?VEH[best.kind].n.toLowerCase():'ride')});
  best.g.visible=true;
  const eta=Math.max(4,Math.round(Math.abs(best.pos-rd.pos)/12));
  toast('Your '+CAB.label+' is coming. ETA about '+eta+' seconds. Meet it at the road.');
  return true;
}
function releaseCab(){const v=CAB.v;if(v){v.g.visible=true;v.pos=clamp(v.pos,-184,184);traffic.push(v);}CAB.v=null;CAB.state='none';cabMark.visible=false;}
function updCab(dt,time){
  const c=CAB,v=c.v;if(!v){return;}
  if(c.state==='coming'){
    const rem=(c.stop-v.pos)*v.dir;
    let target=rem<=0.6?0:Math.min(15,Math.max(1.5,(rem-3)*1.3));
    v.speed+=clamp(target-v.speed,-24*dt,7*dt);v.pos+=v.dir*v.speed*dt;
    if((c.stop-v.pos)*v.dir<0){v.pos=c.stop;v.speed=0;}
    if(rem<=0.8&&v.speed<0.6){c.state='waiting';c.wait=110;toast('Your '+c.label+' has arrived. Walk up to it.');}
  }else if(c.state==='waiting'){v.speed=0;c.wait-=dt;if(c.wait<=0){toast('Your '+c.label+' left.');releaseCab();return;}}
  const p=vehXZ(v);c.x=p.x;c.z=p.z;
  const yaw=v.axis==='z'?(v.dir>0?0:Math.PI):(v.dir>0?Math.PI/2:-Math.PI/2),hx=v.axis==='z'?v.hw:v.hl,hz=v.axis==='z'?v.hl:v.hw;
  v.g.position.set(p.x,groundH(p.x,p.z)+0.02,p.z);v.g.rotation.y=yaw;
  if(c.state!=='riding'){vboxes.push({x0:p.x-hx,x1:p.x+hx,z0:p.z-hz,z1:p.z+hz});cabMark.visible=true;cabMark.position.set(p.x,v.g.position.y+4.4+Math.sin(time*4)*0.3,p.z);cabMark.rotation.y+=dt*2.5;}
  else cabMark.visible=false;
}

const fareTo=(x,z,m)=>Math.max(300,Math.round((200+Math.hypot(x-P.x,z-P.z)*8)*(m||1)/50)*50);
function snapLand(x,z){
  if(z>BR0&&z<ISL_Z0)return{x:0,z:clamp(z,BR0+6,ISL_Z0-6)};
  if(z>=ISL_Z0)return{x:clamp(x,-ISL_W+4,ISL_W-4),z:clamp(z,ISL_Z0+4,ISL_Z1-4)};

function bestFloor(it,view){

/* f = fraction of one game day that has passed */
function crAccrue(f){
  if(!CR||!(f>0))return;
  const fm=1+CR.fame/40;
  CR_SOIDS.forEach(id=>{
    const s=CR.soc[id],P=CR_SOC[id];

    const n=Math.floor(s.pa);if(n<1)return;
    s.pa-=n;s.v+=n;s.dv+=n;s.f+=crGain(id,n,fm);s.l+=Math.round(n*(0.05+crRnd()*0.05));
    if(s.mon){const a=n/1000*P.epm;s.earn+=a;crPay(a,P.n+' creator pay');}
  });
  if(CR.type!=='musician')return;
  const D=crDistNow(),reach=crReach();
  CR.rel.forEach(r=>{
    const age=CR.day-r.day;if(age<0)return;
    const dec=0.3+0.7*Math.exp(-age/25);r.cur=r.cur||{};r.sa=r.sa||{};
    r.plat.forEach(pid=>{

  });

function crChartRows(kind,pid,mode){
  mode=mode||crUI.cm||'top';
  const r=crRng(CR.day*7919+(pid?pid.charCodeAt(0)*31+pid.length:5)+kind.length*17+CR.seed+(mode==='top'?0:911));
  const names=kind==='songs'?CR_SONG2:kind==='artists'?CR_ART2:CR_CRE2;
  const w=pid&&CR_SV[pid]?CR_SV[pid].w:1,rising=mode==='rising';
  const T=kind==='creators'?(pid&&CR_SOC[pid]?{tt:2.2e8,yt:2.6e8,ig:2.4e8,x:1.6e8}[pid]:2.5e8):(rising?3.2e5:4e7)*w;
  const ex=kind==='creators'?(rising?0.62:0.4):(rising?0.45:0.18);
  const val=n=>T*Math.pow(n,-ex);
  const N=20,off=(CR.day*3+(pid?pid.length:0)+(mode==='top'?0:7))%names.length;
  let rows=[];
  for(let i=0;i<N;i++){
    const prevShift=Math.floor(r()*7)-3,isNew=r()<0.08;
    rows.push({n:names[(i*7+off)%names.length],sub:kind==='songs'?CR_ART2[(i*11+off)%CR_ART2.length]:'',v:val(i+1)*(0.97+0.06*r()),prev:isNew?0:Math.max(1,i+1+prevShift),peak:Math.max(1,i+1-Math.floor(r()*4)),wks:isNew?1:2+Math.floor(r()*30)});
  }
  rows.sort((a,b)=>b.v-a.v);
  let mine=0,mname=CR.name;
  if(kind==='songs'){CR.rel.forEach(x=>{const v=crRelWk(x,pid);if(v>mine){mine=v;mname=x.title;}});}
  else if(kind==='artists'){mine=pid&&CR_SV[pid]?crWk(pid):CR_SVIDS.reduce((a,id)=>a+crWk(id),0);}
  else mine=pid&&CR_SOC[pid]?CR.soc[pid].f:crReach();
  const listN=rising?100:200,cut=val(listN);
  let rank=0,inChart=false;
  if(mine>0){rank=Math.max(1,Math.round(Math.pow(T/mine,1/ex)));inChart=rank<=N;if(rising&&rank>9999)rank=9999;}
  if(inChart){rank=rows.filter(x=>x.v>mine).length+1;rows.splice(rank-1,0,{n:mname,sub:kind==='songs'?CR.name:'You',v:mine,me:true,prev:0,peak:rank,wks:1});rows=rows.slice(0,N);}

  if(a==='reset'){if(!crUI.armed){crUI.armed=1;toast('Tap Reset career again to erase it.');setTimeout(()=>crUI.armed=0,4000);return;}try{localStorage.removeItem(CR_KEY);}catch(e){}CR=null;crUI.armed=0;crHud();closePhone();crCreateUI();return;}
  if(a==='mon'){const s=CR.soc[pid],P=CR_SOC[pid];if(s.f>=P.monF&&s.v>=P.monV){s.mon=true;crFame(3);toast(P.n+' monetization approved!');crSave();draw();}return;}
  if(a==='ver'){
    const s=CR.soc[pid],P=CR_SOC[pid];
    if(P.ver.t==='elig'){if(s.f>=P.ver.f){s.ver=true;crFame(5);toast('You are verified on '+P.n+'!');crSave();draw();}return;}
    if(s.verOn){s.verOn=false;s.ver=false;toast('Verification cancelled.');}
    else if(spend(P.ver.fee*crD(),P.n+' verification')){s.verOn=true;s.ver=true;crFame(4);toast('Verified on '+P.n+'. Billed weekly.');}
    crSave();draw();return;
  }
  if(a==='distsub'){
    const d=CR_DIST[ds.d];
    if(spend(d.fee*crD(),d.n+' monthly plan')){CR.distro={id:ds.d,next:CR.day+30,lapsed:false};toast(d.n+' plan active. You keep '+Math.round(d.share*100)+'%.');crSave();draw();}
    return;
  }
  if(a==='distcancel'){CR.distro=null;toast('Plan cancelled. Your songs are offline.');crSave();draw();return;}
}

function crDoPost(pid,idea,boost,rel,img){
  const s=CR.soc[pid],P=CR_SOC[pid],fm=1+CR.fame/40;
  let base=crRi(60,420)*(1+Math.sqrt(s.f)/12)*fm*(s.ver?1.15:1);
  if(pid==='x')base*=0.7;
  const viral=crRnd()<0.04+CR.fame/1500;if(viral)base*=crRi(8,25);
  const views=Math.round(base+boost*100),gain=crGain(pid,views,fm),likes=Math.round(views*(0.05+crRnd()*0.07));
  s.f+=gain;s.v+=views;s.dv+=views;s.l+=likes;s.today++;
  s.posts.unshift({t:idea,v:views,l:likes,d:CR.day,img:img||null});if(s.posts.length>24)s.posts.length=24;
  if(rel){rel.boost=(rel.boost||0)+Math.min(4,views/20000);}
  crFame(Math.min(1.5,views/50000)+(viral?1.5:0));
  addXP(6);crSave();
  toast((viral?'VIRAL! ':'')+'+'+crN(views)+' views, +'+gain+' '+P.unit+(rel?' · boosting "'+rel.title+'"':''));
}

    let a=buckets.get(o.material);if(!a){a=[];buckets.set(o.material,a);}a.push(geo);
  });});

    try{
      let n=0;geos.forEach(g=>{n+=g.attributes.position.count;});
      const pos=new Float32Array(n*3),nor=new Float32Array(n*3),uv=new Float32Array(n*2);let o=0;
      geos.forEach(g=>{pos.set(g.attributes.position.array,o*3);if(g.attributes.normal)nor.set(g.attributes.normal.array,o*3);if(g.attributes.uv)uv.set(g.attributes.uv.array,o*2);o+=g.attributes.position.count;g.dispose();});
      const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(pos,3));bg.setAttribute('normal',new THREE.BufferAttribute(nor,3));bg.setAttribute('uv',new THREE.BufferAttribute(uv,2));
      const me=new THREE.Mesh(bg,m);me.receiveShadow=true;scene.add(me);

  });

let AQ={ema:0.016,t:0,pr:Math.min(window.devicePixelRatio||1,1.5)};
function adaptQuality(dt){
  if(dt>0.25)return;
  AQ.ema+=(dt-AQ.ema)*0.05;AQ.t+=dt;
  if(AQ.t<2.5)return;AQ.t=0;
  let pr=AQ.pr;
  if(AQ.ema>0.026&&pr>0.6)pr=Math.max(0.6,pr-0.25);
  else if(AQ.ema<0.019&&pr<Math.min(window.devicePixelRatio||1,1.5))pr=Math.min(Math.min(window.devicePixelRatio||1,1.5),pr+0.25);
  if(pr!==AQ.pr){AQ.pr=pr;try{renderer.setPixelRatio(pr);resize();}catch(e){}}
}

  if(inside){const Q=inside.P,c=Q.W(0,0);ml.position.set(c.x,(MLV?MH.F1:0.4)+2.8,c.z);ml.intensity=0.8+night*1.1;}else ml.intensity=0;

    const hideUp=(inside&&MLV===0&&!(HD.on&&HD.floor===1))||(HD.on&&HD.prop!=='home'&&HD.floor===0);
    for(const p of S.placed){if((p.f|0)===1){const e=PLG[p.u];if(e)e.g.visible=!hideUp;}}
  }
  for(const g of MG){const vis=near&&Math.abs(g.x-P.x)<60&&Math.abs(g.z-P.z)<60;if(g.ch.root.visible!==vis)g.ch.root.visible=vis;if(vis)g.ch.update(dt,0,true,0);}
}

function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}

let last=performance.now(),clock=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;
  const ph0=S.hour;S.hour=(S.hour+dt/30)%24;
  if(S.hour<ph0&&S.savings>0){const gain=Math.round(S.savings*0.03);S.savings+=gain;logTx('Savings interest',gain);toast('Savings interest: +₦'+gain.toLocaleString('en-NG'));}
  S.mood+=((S.energy*0.85+10)-S.mood)*dt*0.02;S.mood=clamp(S.mood,0,100);
  updTraffic(dt);jfCarsStep(dt);updCab(dt,clock);
  if(!S.driving)vboxes.push(parkedBox());
  if(S.driving)updCar(dt);else updPlayer(dt);
  if(!S.driving)carObj.g.position.y=groundH(CAR.x,CAR.z);
  updNPCs(dt);
  for(const v of vendors){if(Math.abs(v.root.parent.position.x-P.x)<70&&Math.abs(v.root.parent.position.z-P.z)<70)v.update(dt,0,true,0);}
  updPickups(dt,clock,S.driving?CAR.x:P.x,S.driving?CAR.z:P.z,S.driving?3.4:2.4);
  updCamera(dt);updSky(cam.tx,cam.tz,dt);updDoors(dt);updHospital(dt,updRoofs(dt));updJF(dt,jfInside);updBQ(dt);updFX();updHome(dt,clock);updWork(dt,clock);updMansion(dt,clock);updMusic(dt,bqInside);updAmbulance(dt);tvMat.emissiveIntensity=0.45+0.2*Math.sin(clock*2.3)*Math.sin(clock*7.1);
  S.health=clamp(S.health-dt*(S.energy<15?0.08:0.012),0,100);if(S.health<=0&&!busy)faint();
  updVehFx(dt,clock);updHud(dt);updJob(dt);drawMinimap(dt);if(PH.open)tickPhone(dt);
  renderer.render(scene,camera);
}
